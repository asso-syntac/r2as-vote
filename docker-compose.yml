version: '3.8'

services:
  frankenphp:
    build: .
    container_name: r2as-vote-frankenphp
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile
    env_file:
      - .env.local
    environment:
      - APP_ENV=dev
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/app.db
      - SERVER_NAME=:80
    networks:
      - r2as-network

networks:
  r2as-network:
    driver: bridge
