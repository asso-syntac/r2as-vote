services:
  frankenphp:
    build: .
    container_name: r2as-vote-frankenphp
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile
    env_file:
      - .env.local
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://r2as:r2as@postgres:5432/r2as_vote?serverVersion=17&charset=utf8
      - SERVER_NAME=:80
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - r2as-network

  postgres:
    image: postgres:17-alpine
    container_name: r2as-vote-postgres
    environment:
      POSTGRES_USER: r2as
      POSTGRES_PASSWORD: r2as
      POSTGRES_DB: r2as_vote
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2as -d r2as_vote"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - r2as-network

networks:
  r2as-network:
    driver: bridge

volumes:
  postgres-data:
